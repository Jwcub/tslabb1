<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/src/css/style.scss">
        <title>Laboration 1 - Typescript</title>

    <body>
        <header>
            <h1>Laboration 1</h1>
        </header>
        <main>
            <sektion class="courses">
                <h2>Kurser</h2>

                <table>
                    <thead>
                        <tr>
                            <th>Kurskod</th>
                            <th>Kursnamn</th>
                            <th>Progression</th>
                            <th>Kursplan</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>DT654G</td>
                            <td>Stickning</td>
                            <td>A</td>
                            <td>Länk</td>

                    </tbody>

            <section class="add-course">

            <form class="add-new-course">

                <label>Kursnamn:<br>

                </label>

                <label>Progression:<br>
                    <input type="text">
                </label>

                <label>Kursplan:<br>
                    <input type="text">
                </label>

                <button class="form-btn">+ Lägg till kurs</button>
            </form>
            </section>

        </main>


        <script type="module" src="/src/js/main.ts"></script>
