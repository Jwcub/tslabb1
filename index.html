<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/src/css/style.scss">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=delete">

        <title>Laboration 1 - Typescript</title>
    </head>
    <body>
        <header>
            <h1>Laboration 1</h1>
        </header>
        <main>
            <sektion class="courses">
                <h2>Kurser</h2>

                <table>
                    <thead>
                        <tr>
                            <th>Kurskod</th>
                            <th>Kursnamn</th>
                            <th>Progression</th>
                            <th>Kursplan</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </sektion>

            <section class="add-course">
            <h2>Lägg till kurs</h2>

            <form class="add-new-course">
                <label>Kurskod:<br>
                    <input type="text" id="course-code">
                </label>

                <label>Kursnamn:<br>
                    <input type="text" id="course-name">
                </label>

                <label>Progression:<br>
                    <select id="progression">
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                    </select>
                </label>

                <label>Kursplan:<br>
                    <input type="text" id="syllabus">
                </label>

                <button class="form-btn">+ Lägg till kurs</button>
            </form>

            <div id="error-message"></div>

            </section>

        </main>


        <script type="module" src="/src/js/main.ts"></script>
    </body>
</html>
